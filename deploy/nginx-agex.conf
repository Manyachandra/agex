# Agex production hosts — copy to /etc/nginx/sites-available/agex
# Then: certbot --nginx -d agex.zone -d www.agex.zone -d docs.agex.zone -d app.agex.zone -d www.app.agex.zone

upstream agex_node {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Apex → www landing
server {
    listen 80;
    listen [::]:80;
    server_name agex.zone;
    return 301 https://www.agex.zone$request_uri;
}

# Landing
server {
    listen 80;
    listen [::]:80;
    server_name www.agex.zone;

    root /root/agex/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Docs
server {
    listen 80;
    listen [::]:80;
    server_name docs.agex.zone;

    root /root/agex/docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# App alias → www.app
server {
    listen 80;
    listen [::]:80;
    server_name app.agex.zone;
    return 301 https://www.app.agex.zone$request_uri;
}

# Desk + API + Socket.io
server {
    listen 80;
    listen [::]:80;
    server_name www.app.agex.zone;

    location / {
        proxy_pass http://agex_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
