# Agex production nginx — copy to /etc/nginx/sites-available/agex
# Static sites live under /var/www/agex (nginx cannot read /root).
# Cert: certbot --nginx -d agex.zone -d docs.agex.zone -d app.agex.zone -d www.app.agex.zone

upstream agex_node {
    server 127.0.0.1:5000;
    keepalive 32;
}

# =========================================================
# AGEX LANDING PAGE — https://agex.zone
# =========================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agex.zone;

    root /var/www/agex/landing;
    index index.html;

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/agex.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agex.zone/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# =========================================================
# AGEX APP — https://app.agex.zone (canonical)
# =========================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.agex.zone;

    location / {
        proxy_pass http://agex_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    ssl_certificate /etc/letsencrypt/live/agex.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agex.zone/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www.app → canonical app (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.app.agex.zone;

    return 301 https://app.agex.zone$request_uri;

    ssl_certificate /etc/letsencrypt/live/agex.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agex.zone/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# =========================================================
# AGEX DOCUMENTATION — https://docs.agex.zone
# =========================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.agex.zone;

    root /var/www/agex/docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/agex.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agex.zone/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# =========================================================
# HTTP → HTTPS
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name agex.zone;
    return 301 https://agex.zone$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.agex.zone;
    return 301 https://app.agex.zone$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.app.agex.zone;
    return 301 https://app.agex.zone$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.agex.zone;
    return 301 https://docs.agex.zone$request_uri;
}
